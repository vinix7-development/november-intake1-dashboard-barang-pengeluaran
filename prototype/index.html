<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Barang dan Pengeluaran</title>
<style>:root{--accent:#0f766e;--bg:#f1f4f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:#1d2230}
main{padding:24px;width:100%;min-width:0}
h2{font-size:22px;margin-bottom:16px}h3{font-size:16px;margin-bottom:10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:#fff;border:1px solid #e3e6ee;border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.grid>.card{margin:0}
.k{color:#667085;font-size:13px}.v{font-size:24px;font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #edf0f5;white-space:nowrap}th{color:#667085;font-weight:600}
form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
label{display:grid;gap:4px;font-size:13px;color:#475467}
input,select{font:inherit;padding:8px 10px;border:1px solid #cfd4df;border-radius:8px;background:#fff;width:100%}
.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.alt{background:#eef0f5;color:#1d2230}.btn.sm{padding:4px 10px;font-size:13px}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600}
.g{background:#dcfae6;color:#085d3a}.y{background:#fef0c7;color:#7a4504}.r{background:#fee4e2;color:#912018}.n{background:#eef0f5;color:#344054}
.bar{height:10px;background:#eef0f5;border-radius:99px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--accent)}
.bar i.y{background:#f79009}.bar i.r{background:#d92d20}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#toast{position:fixed;right:16px;bottom:16px;background:#1d2230;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90vw}
.note{font-size:12px;color:#667085;margin-top:18px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut>div{width:116px;height:116px;border-radius:50%;background:var(--card,#fff);display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px}
.legend{list-style:none;flex:1;min-width:180px}.legend li{display:flex;gap:8px;align-items:center;padding:4px 0}.legend i{width:10px;height:10px;border-radius:3px}.legend b{margin-left:auto}
.cols{display:flex;gap:18px;align-items:flex-end;height:240px;padding-top:10px}.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:#667085}
.col>div{display:flex;gap:4px;align-items:flex-end;flex:1;width:100%;justify-content:center}.col i{width:32%;max-width:34px;border-radius:5px 5px 0 0;background:var(--accent)}.col i.y{background:#f79009}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);margin-bottom:16px}.split>.card{margin:0}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}

/* panel admin gudang: sidebar + topbar, padat */
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:#10231f;color:#fff;padding:18px 10px}aside h1{font-size:17px;padding:0 10px 18px}
#nav button{display:flex;gap:10px;width:100%;background:none;border:0;border-left:3px solid transparent;color:#b6cbc6;padding:11px 12px;font:inherit;cursor:pointer;text-align:left}
#nav button.on{border-left-color:#2dd4bf;background:#ffffff12;color:#fff}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border-bottom:1px solid #dfe5e4;padding:12px 24px}
.card{border-radius:6px}.btn,input,select{border-radius:5px!important}
.kpi .card{border-top:3px solid var(--accent);border-radius:0 0 6px 6px}
@media(max-width:720px){.wrap{display:block}aside{padding:6px}aside h1{display:none}#nav{display:flex;overflow-x:auto}#nav button{width:auto;white-space:nowrap}main{padding:14px}}
</style></head><body><div class="wrap"><aside><h1>Dashboard Barang dan Pengeluaran</h1><div id="nav"></div></aside><div style="min-width:0"><div class="top"><span></span><div><button class="btn alt sm" onclick="go('Barang keluar')">Barang keluar</button> <button class="btn sm" onclick="go('Barang masuk')">+ Barang masuk</button></div></div><main></main></div></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'-':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const opt=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
const table=(h,r)=>`<div class="scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="k">Belum ada data.</td></tr>`}</table></div>`;
const stat=(k,v,s='')=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="k">${s}</div></div>`;
const bar=(label,right,pct,c='')=>`<div class="row"><span>${label}</span><span class="k">${right}</span></div><div class="bar"><i class="${c}" style="width:${Math.min(100,pct)}%"></i></div>`;
let page,timer;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2800)}
function go(p){page=p;render()}
function render(){
  $('#nav').innerHTML=Object.keys(PAGES).map(p=>`<button class="${p===page?'on':''}" onclick="go('${p}')">${ICONS[p]?`<span class="ic" aria-hidden="true">${ICONS[p]}</span>`:''}<span>${p}</span></button>`).join('');
  $('main').dataset.page=page;
  $('main').innerHTML=`<h2>${page}</h2>`+PAGES[page]()+`<p class="note">Prototipe tampilan. Data dummy, tersimpan hanya selama halaman terbuka.${typeof NOTE==='string'?' '+NOTE:''}</p>`;
}
function donut(entries,colors,center){const t=sum(entries,e=>e[1])||1;let a=0;const seg=entries.map((e,i)=>{const s=a;a+=e[1]/t*100;return `${colors[i%colors.length]} ${s}% ${a}%`}).join(',');
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${seg})"><div>${center}</div></div><ul class="legend">${entries.map((e,i)=>`<li><i style="background:${colors[i%colors.length]}"></i>${esc(e[0])}<b>${rp(e[1])}</b></li>`).join('')}</ul></div>`}
function readForm(e){e.preventDefault();return Object.fromEntries(new FormData(e.target))}
function csv(name,rows){const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=name;a.click()}

const TITLE='Barang & Pengeluaran';
const items=[{n:'Beras 5 kg',s:24,m:10,h:62000},{n:'Minyak goreng 1 L',s:6,m:12,h:15500},{n:'Gula 1 kg',s:30,m:8,h:14000},{n:'Mi instan (dus)',s:3,m:5,h:105000}];
const moves=[{d:'2026-11-24',n:'Beras 5 kg',a:'masuk',q:20,t:1240000,r:'Sumber Pangan'},{d:'2026-11-25',n:'Minyak goreng 1 L',a:'keluar',q:8,t:0,r:'terjual'},{d:'2026-11-25',n:'Gula 1 kg',a:'masuk',q:10,t:140000,r:'Sumber Pangan'},{d:'2026-11-26',n:'Mi instan (dus)',a:'keluar',q:2,t:0,r:'terjual'}];
const costs=[{d:'2026-11-05',c:'Listrik',v:350000,t:'Token'},{d:'2026-11-20',c:'Gaji',v:1500000,t:'Staf'},{d:'2026-11-23',c:'Transport',v:120000,t:'Antar barang'}];
let from='2026-11-01',to='2026-11-30';
const buy=()=>sum(moves,m=>m.t), ops=()=>sum(costs,c=>c.v);
function moveForm(kind){return `<div class="card"><h3>Catat barang ${kind}</h3><form onsubmit="addMove(event,'${kind}')">
<label>Barang<select name="n">${opt(items.map(i=>i.n))}</select></label><label>Jumlah<input name="q" type="number" min="1" step="1" required></label>
${kind==='masuk'?'<label>Harga beli per satuan<input name="h" type="number" min="0" required></label><label>Pemasok<input name="r"></label>':'<label>Alasan<select name="r"><option>terjual</option><option>rusak</option><option>retur</option></select></label>'}
<button class="btn">Simpan</button></form></div>
<div class="card">${table(['Tanggal','Barang','Jumlah',kind==='masuk'?'Nilai':'Alasan'],moves.filter(m=>m.a===kind).map(m=>[m.d,esc(m.n),m.q,kind==='masuk'?rp(m.t):esc(m.r)]).reverse())}</div>`}
function addMove(e,kind){const f=readForm(e),i=items.find(x=>x.n===f.n),q=+f.q;
  if(kind==='keluar'&&q>i.s)return toast(`Stok tidak cukup. Sisa ${i.s}.`);
  i.s+=kind==='masuk'?q:-q; if(kind==='masuk')i.h=+f.h;
  moves.push({d:'2026-11-26',n:i.n,a:kind,q,t:kind==='masuk'?q*+f.h:0,r:f.r});render();toast('Tersimpan')}
function addCost(e){const f=readForm(e);costs.push({d:f.d,c:f.c,v:+f.v,t:f.t});render();toast('Tersimpan')}
function addItem(e){const f=readForm(e);if(items.some(i=>i.n===f.n))return toast('Nama barang sudah ada.');items.push({n:f.n,s:0,m:+f.m,h:+f.h});render()}
function rows(){return [...moves.filter(m=>m.a==='masuk').map(m=>[m.d,'Pembelian barang',m.n,m.t]),...costs.map(c=>[c.d,'Operasional',c.c,c.v])].filter(r=>r[0]>=from&&r[0]<=to).sort()}
const PAGES={
'Dasbor':()=>{const low=items.filter(i=>i.s<i.m),tot=buy()+ops(),days=[...new Set(moves.map(m=>m.d))].sort().slice(-5),mx=Math.max(...moves.map(m=>m.q));
 const cat={'Pembelian barang':buy()};costs.forEach(c=>cat[c.c]=(cat[c.c]||0)+c.v);
 return `<div class="grid">${stat('Pengeluaran bulan ini',rp(tot))}${stat('Nilai persediaan',rp(sum(items,i=>i.s*i.h)))}${stat('Stok menipis',low.length,'barang')}</div>
 <div class="grid two"><div class="card"><h3>Barang masuk vs keluar</h3>${days.map(d=>['masuk','keluar'].map(a=>{const q=sum(moves.filter(m=>m.d===d&&m.a===a),m=>m.q);return bar(`${d} · ${a}`,q,q/mx*100,a==='keluar'?'y':'')}).join('')).join('')}</div>
 <div class="card"><h3>Pengeluaran per kategori</h3>${Object.entries(cat).map(([k,v])=>bar(esc(k),rp(v),v/tot*100)).join('')}</div></div>
 <div class="card"><h3>Perlu restock</h3>${table(['Barang','Stok','Minimum'],low.map(i=>[esc(i.n),`<span class="tag r">${i.s}</span>`,i.m]))}</div>`},
'Master barang':()=>`<div class="card"><form onsubmit="addItem(event)"><label>Nama barang<input name="n" required></label><label>Harga beli<input name="h" type="number" min="0" required></label><label>Stok minimum<input name="m" type="number" min="0" required></label><button class="btn">Tambah</button></form></div>
<div class="card">${table(['Barang','Stok','Harga beli','Status'],items.map(i=>[esc(i.n),i.s,rp(i.h),i.s<i.m?'<span class="tag r">menipis</span>':'<span class="tag g">aman</span>']))}</div>`,
'Barang masuk':()=>moveForm('masuk'),
'Barang keluar':()=>moveForm('keluar'),
'Pengeluaran':()=>`<div class="card"><h3>Biaya operasional</h3><form onsubmit="addCost(event)"><label>Tanggal<input name="d" type="date" value="2026-11-26" required></label><label>Kategori<select name="c"><option>Listrik</option><option>Gaji</option><option>Transport</option><option>Sewa</option><option>Lainnya</option></select></label><label>Nominal<input name="v" type="number" min="1" required></label><label>Catatan<input name="t"></label><button class="btn">Simpan</button></form></div>
<div class="card">${table(['Tanggal','Kategori','Nominal','Catatan'],costs.map(c=>[c.d,esc(c.c),rp(c.v),esc(c.t)]).reverse())}</div>`,
'Laporan':()=>`<div class="card"><form onsubmit="const f=readForm(event);from=f.a;to=f.b;render()"><label>Dari<input type="date" name="a" value="${from}"></label><label>Sampai<input type="date" name="b" value="${to}"></label><button class="btn">Terapkan</button><button type="button" class="btn alt" onclick="csv('pengeluaran.csv',[['tanggal','jenis','keterangan','nominal'],...rows()])">Ekspor CSV</button></form></div>
<div class="card"><h3>Total ${rp(sum(rows(),r=>r[3]))}</h3>${table(['Tanggal','Jenis','Keterangan','Nominal'],rows().map(r=>[r[0],r[1],esc(r[2]),rp(r[3])]))}</div>`
};

const ICONS={};
PAGES['Dasbor']=()=>{const low=items.filter(i=>i.s<i.m),days=[...new Set(moves.map(m=>m.d))].sort().slice(-7),mx=Math.max(...moves.map(m=>m.q));
 const cat={'Pembelian barang':buy()};costs.forEach(c=>cat[c.c]=(cat[c.c]||0)+c.v);
 return `<div class="grid kpi">${stat('Pengeluaran bulan ini',rp(buy()+ops()))}${stat('Pembelian barang',rp(buy()))}${stat('Biaya operasional',rp(ops()))}${stat('Nilai persediaan',rp(sum(items,i=>i.s*i.h)))}${stat('Stok menipis',low.length+' barang')}</div>
 <div class="split"><div class="card"><h3>Barang masuk (hijau) vs keluar (oranye)</h3><div class="cols">${days.map(d=>`<div class="col"><div>${['masuk','keluar'].map(a=>{const q=sum(moves.filter(m=>m.d===d&&m.a===a),m=>m.q);return `<i class="${a==='keluar'?'y':''}" style="height:${Math.min(100,q/mx*100)}%" title="${a} ${q}"></i>`}).join('')}</div>${d.slice(5)}</div>`).join('')}</div></div>
 <div class="card"><h3>Komposisi pengeluaran</h3>${donut(Object.entries(cat),['#0f766e','#f79009','#6366f1','#db2777','#64748b'],rp(buy()+ops()))}</div></div>
 <div class="split"><div class="card"><h3>Mutasi terakhir</h3>${table(['Tanggal','Barang','Arah','Jumlah'],moves.slice(-6).reverse().map(m=>[m.d,esc(m.n),`<span class="tag ${m.a==='masuk'?'g':'y'}">${m.a}</span>`,m.q]))}</div>
 <div class="card"><h3>Perlu restock</h3>${table(['Barang','Stok','Min'],low.map(i=>[esc(i.n),`<span class="tag r">${i.s}</span>`,i.m]))}</div></div>`};

go(Object.keys(PAGES)[0]);
</script></body></html>
